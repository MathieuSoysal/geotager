name: Feature request
description: Propose a format, an operation, or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: some promises are non-negotiable here, and a feature that
        breaks one will be declined however good it is: nothing leaves the user's machine, pixels
        are never re-encoded, and a capability only opens with a test that proves it on a real
        file. [`CONTRIBUTING.md`](https://github.com/MathieuSoysal/geotager/blob/main/CONTRIBUTING.md) has the full list.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that the tool does not do today.
      placeholder: My camera writes …, and Geotager says …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: If it is a format, a sample file you have the right to share makes it real.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
