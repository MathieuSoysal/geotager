# Continuous integration.
#
# The Cloudflare build only runs `npm run build`: it never replays the tests,
# and its image has no ExifTool. Without this workflow nothing automatic checks
# the format by operation matrix in the README, when the project's rule is that
# a cell only turns to yes once its test is green. It is also the only guard for
# outside contributions, which get no Cloudflare preview.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ExifTool is the independent oracle: an engine that reads itself back
      # proves nothing. It is never used by the application itself.
      #
      # libheif is a second oracle of a different kind: ExifTool says what the
      # file contains, libheif says it still decodes. A file whose location
      # block has been moved can satisfy the first and no longer the second.
      - name: Installer les oracles externes
        run: |
          sudo apt-get update -qq
          # On Ubuntu 24.04 libheif decodes nothing on its own: its decoders are
          # separate packages. Without libde265 it opens no HEIC, without dav1d
          # no AVIF, and the oracle would report perfectly sound files as
          # unreadable.
          sudo apt-get install -y -qq libimage-exiftool-perl libheif-examples \
            libheif-plugin-libde265 libheif-plugin-dav1d libheif-plugin-aomdec
          exiftool -ver
          heif-info --version || true

      - run: npm ci

      # The end-to-end run drives a real Chromium.
      - name: Installer Chromium
        run: npx playwright install chromium --with-deps

      # fixtures -> engine -> build (blocking checks) -> end to end.
      - run: npm run test:all
