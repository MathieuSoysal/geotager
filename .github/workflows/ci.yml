# Intégration continue.
#
# La build Cloudflare ne lance que `npm run build` : elle ne rejoue jamais les
# tests, et son image ne contient pas ExifTool. Sans ce workflow, la matrice
# format × opération du README n'est vérifiée par rien d'automatique, alors que
# la règle du projet est qu'une case ne passe à « oui » qu'une fois son test
# vert. C'est aussi le seul garde-fou pour les contributions extérieures, qui
# n'obtiennent pas de prévisualisation Cloudflare (Q-007).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` — l'historique ENTIER, et c'est le plan du site qui le
      # demande. Par défaut cette action clone à une profondeur de UN : `git log`
      # n'a alors qu'un seul commit à montrer, et `derniereMaj` rend la date de
      # CE commit pour chaque page — c'est-à-dire un horodatage de build, très
      # exactement ce que `src/lib/histoire.ts` dit refuser d'écrire. Les seize
      # pages déclaraient ainsi le même `lastmod`, et il rajeunissait à chaque
      # déploiement. Google ne lit `lastmod` que s'il est « consistently and
      # verifiably accurate » ; seize dates qui bougent ensemble sans qu'une
      # ligne ait changé sont le contraire.
      #
      # Le coût est un clone complet d'un dépôt de cette taille, soit quelques
      # secondes. La date de première parution des guides le demande de même.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ExifTool sert d'oracle indépendant : un moteur qui se relit lui-même ne
      # prouve rien. Il n'est jamais utilisé par l'application elle-même.
      #
      # libheif en est un second, et d'une autre nature : ExifTool dit ce que le
      # fichier CONTIENT, libheif dit qu'il se DÉCODE encore. Un fichier dont on
      # a déplacé le bloc de position peut satisfaire le premier et plus le
      # second. Ni l'un ni l'autre n'est utilisé par l'application.
      - name: Installer les oracles externes
        run: |
          sudo apt-get update -qq
          # Sur Ubuntu 24.04, libheif ne décode rien tout seul : ses décodeurs
          # sont des paquets séparés. Sans libde265 il n'ouvre aucun HEIC, sans
          # dav1d aucun AVIF — et l'oracle rendrait « illisible » sur des
          # fichiers parfaitement sains.
          sudo apt-get install -y -qq libimage-exiftool-perl libheif-examples \
            libheif-plugin-libde265 libheif-plugin-dav1d libheif-plugin-aomdec
          exiftool -ver
          heif-info --version || true

      - run: npm ci

      # Le parcours de bout en bout pilote un vrai Chromium.
      - name: Installer Chromium
        run: npx playwright install chromium --with-deps

      # fixtures -> moteur -> build (contrôles bloquants) -> bout en bout.
      - run: npm run test:all
