# Publishing to npm.
#
# Triggered by a release, never by a merge. An npm version is immutable: 1.0.0
# is not republished, it cannot be withdrawn after twenty-four hours, and what
# has gone has gone. Publishing on every merge to `main` would therefore fail on
# every merge that does not change the number, and succeed irreversibly on the
# ones that change it unintentionally.
#
# Three refusals before the first byte is sent, in this order:
#
#   1. the release tag and both manifest version numbers must agree;
#   2. the CLI's dependency on the core must accept the core about to be
#      published;
#   3. the whole test chain must pass, the same one continuous integration
#      runs, external oracles included.
#
# The third is the most expensive and the one not to skip. A merged regression
# is a fix; a published regression is a dead version and a burnt number.
name: Publication

on:
  release:
    types: [published]
  # For exercising the workflow itself without publishing anything. `dry-run`
  # defaults to true: a manual trigger must not be able to publish by accident.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Tout faire, sauf envoyer à npm'
        type: boolean
        default: true

# `id-token: write` is for provenance: npm then records, in a public log, the
# link between the published package, this repository, this commit and this run.
# Anyone installing can verify the tarball came from here and not from somebody's
# laptop.
permissions:
  contents: read
  id-token: write

# Two simultaneous publishes of the same version would collide, and the second
# would fail half way: core published, CLI not.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest

    # A place to hang a required approval, in the repository settings, without
    # touching this file. It is also where NPM_TOKEN lives.
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Writes the `.npmrc` that makes `npm publish` read NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      # --- 1. do the tag and the manifests agree? --------------------------
      #
      # Without this check, publishing 1.2.0 from a `v1.2.0` tag whose manifests
      # still say 1.1.0 succeeds without a word: npm only looks at the manifest.
      # You end up with a GitHub release v1.2.0 and an npm package 1.1.0, and
      # nothing complained.
      - name: Contrôler les numéros de version
        id: versions
        run: |
          CORE=$(node -p "require('./packages/core/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"

          if [ "$CORE" != "$CLI" ]; then
            echo "::error::@geotager/core est en $CORE et geotager en $CLI." \
                 "Les deux paquets sont versionnés ensemble : alignez-les, ou" \
                 "séparez ce workflow en deux avant de les faire diverger."
            exit 1
          fi

          # A manual trigger has no tag: there is nothing to compare, and the
          # manifest is then the sole authority.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${TAG#v}" != "$CORE" ]; then
              echo "::error::La publication s'appelle « $TAG » mais les" \
                   "manifestes portent $CORE. Corrigez l'un ou l'autre :" \
                   "npm ne regarde que le manifeste, et publierait $CORE."
              exit 1
            fi
          fi

          echo "Version à publier : $CORE"

      # --- 2. does the CLI accept this core? -------------------------------
      #
      # `geotager` depends on `@geotager/core`. Publishing a 2.0.0 core while
      # the CLI still asks for `^1.0.0` produces a package that installs by
      # pulling a version that no longer exists, or worse, an old one.
      - name: Contrôler la dépendance entre les deux paquets
        run: |
          PLAGE=$(node -p "require('./packages/cli/package.json').dependencies['@geotager/core']")
          CORE="${{ steps.versions.outputs.core }}"
          node -e "
            const plage = process.argv[1], version = process.argv[2];
            const majeurPlage = plage.replace(/^[^0-9]*/, '').split('.')[0];
            const majeurCore  = version.split('.')[0];
            if (majeurPlage !== majeurCore) {
              console.error(
                '::error::geotager demande @geotager/core ' + plage +
                ', mais on publie ' + version + '. Mettez la dépendance à jour.');
              process.exit(1);
            }
            console.log('geotager demande ' + plage + ' — compatible avec ' + version + '.');
          " "$PLAGE" "$CORE"

      # --- 3. the whole chain, oracles included ---------------------------
      #
      # Exactly what `ci.yml` does. A published package cannot be taken back:
      # this is the one place in the repository where a previous run cannot be
      # trusted, however green it was ten minutes ago, since the tag may point
      # at a different commit from the one that was tested.
      - name: Installer les oracles externes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl libheif-examples \
            libheif-plugin-libde265 libheif-plugin-dav1d libheif-plugin-aomdec
          exiftool -ver
          heif-info --version || true

      - run: npm ci

      - name: Installer Chromium
        run: npx playwright install chromium --with-deps

      - run: npm run test:all

      # --- 4. publish, core first -----------------------------------------
      #
      # The order matters. `geotager` depends on `@geotager/core`: published
      # first, it would be installable and broken until the other arrived. npm
      # does not prevent this, since it does not check dependency existence at
      # publish time.
      #
      # `--provenance` attaches proof of origin. `--access public` is required
      # for the first push of a scoped package, which npm otherwise creates
      # private and refuses on a free account.
      #
      # Skipping when the version already exists makes the workflow replayable:
      # a publish retried after a mid-way failure will not trip over the package
      # that already went out.
      - name: Publier @geotager/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.versions.outputs.core }}
          ESSAI: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if npm view "@geotager/core@$VERSION" version >/dev/null 2>&1; then
            echo "@geotager/core@$VERSION est déjà publiée — rien à faire."
            exit 0
          fi
          if [ "$ESSAI" = "true" ]; then
            npm publish --workspace @geotager/core --access public --dry-run
          else
            npm publish --workspace @geotager/core --access public --provenance
          fi

      - name: Publier geotager
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.versions.outputs.cli }}
          ESSAI: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if npm view "geotager@$VERSION" version >/dev/null 2>&1; then
            echo "geotager@$VERSION est déjà publiée — rien à faire."
            exit 0
          fi
          if [ "$ESSAI" = "true" ]; then
            npm publish --workspace geotager --access public --dry-run
          else
            npm publish --workspace geotager --access public --provenance
          fi

      # --- 5. does the published package actually install? -----------------
      #
      # The only check that looks at what npm really served rather than what we
      # sent it. It catches what no test in the repository can see: a `files`
      # field too narrow, a `bin` without the execute bit, an export entry that
      # does not resolve once outside the repository.
      - name: Éprouver le paquet tel que npm le sert
        if: ${{ github.event_name == 'release' }}
        env:
          VERSION: ${{ steps.versions.outputs.cli }}
        run: |
          # npm takes a few seconds to serve a freshly published version.
          for essai in 1 2 3 4 5 6; do
            if npm view "geotager@$VERSION" version >/dev/null 2>&1; then break; fi
            echo "pas encore servie, nouvelle tentative dans 10 s ($essai/6)"
            sleep 10
          done

          cd "$(mktemp -d)"
          npx --yes "geotager@$VERSION" --version
          # A real operation, on a real file, from the published package.
          cp "$GITHUB_WORKSPACE/test/fixtures/DSCN0010.jpg" photo.jpg 2>/dev/null \
            || curl -sL -o photo.jpg \
               https://raw.githubusercontent.com/ianare/exif-samples/master/jpg/gps/DSCN0010.jpg
          npx --yes "geotager@$VERSION" read photo.jpg --quiet | tee sortie.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('sortie.json', 'utf8'));
            if (!r[0] || !r[0].gps || typeof r[0].gps.lat !== 'number') {
              console.error('::error::Le paquet publié ne relit pas la position.');
              process.exit(1);
            }
            console.log('Le paquet publié lit bien', r[0].gps.lat, r[0].gps.lng);
          "
